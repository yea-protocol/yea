name: release
# Push a tag like v0.1.1 (or run manually) to publish. npm: trusted publishing (OIDC) with
# provenance, NPM_TOKEN secret as a fallback. PyPI: trusted publishing. Artifacts are attested.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: npm ci && npm run build && npm test
        env: { SKIP_INTEROP: "1" }
      # Both npm packages share one version: bump ts/ and cli/ (and cli's sdk dependency) together.
      - run: mkdir npm-dist && npm pack -w @yea-protocol/sdk -w @yea-protocol/cli --pack-destination npm-dist
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "npm-dist/*.tgz" }
      # The SDK first: the CLI depends on it.
      - run: |
          npm publish npm-dist/yea-protocol-sdk-*.tgz --provenance --access public
          npm publish npm-dist/yea-protocol-cli-*.tgz --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - uses: actions/upload-artifact@v4
        with: { name: npm, path: "npm-dist/*.tgz" }
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv build
        working-directory: python
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "python/dist/*" }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
      - uses: actions/upload-artifact@v4
        with: { name: pypi, path: "python/dist/*" }
  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
  mcp-registry:
    needs: [npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
