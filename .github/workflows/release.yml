name: release
# Push a tag like v0.1.1 to publish, or run it by hand with that tag picked as the ref (any other
# ref fails). npm: trusted publishing (OIDC) with provenance, NPM_TOKEN secret as a fallback.
# PyPI: trusted publishing. Artifacts are attested. Before tagging, bump every version with
# `npm run release:version <x.y.z>` (CONTRIBUTING.md#changelog-and-releases). The job timeouts are
# generous on purpose: one that fires between two `npm publish` calls leaves a half-published release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  # Nothing publishes unless this run is on a tag and the dry run passes on it: every version,
  # CHANGELOG's top heading and the tag name one version, and the packed artifacts install and run.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: release from a v<version> tag
        if: github.ref_type != 'tag'
        run: echo "::error::Release from a v<version> tag, not $GITHUB_REF_NAME" && exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.13" }
      - run: npm ci && npm run build
      - run: npm run release:dry-run -- "$GITHUB_REF_NAME"
  npm:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest
      - run: npm ci && npm run build && npm test
        env: { SKIP_INTEROP: "1" }
      - run: mkdir npm-dist && npm pack -w @yea-protocol/sdk -w @yea-protocol/cli -w @yea-protocol/mcp -w @yea-protocol/stripe --pack-destination npm-dist
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "npm-dist/*.tgz" }
      # The SDK first, then the MCP plugin: the CLI (`yea mcp` is the bridge) and the Stripe connector depend on both.
      - run: |
          npm publish npm-dist/yea-protocol-sdk-*.tgz --provenance --access public
          npm publish npm-dist/yea-protocol-mcp-*.tgz --provenance --access public
          npm publish npm-dist/yea-protocol-cli-*.tgz --provenance --access public
          npm publish npm-dist/yea-protocol-stripe-*.tgz --provenance --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - uses: actions/upload-artifact@v7
        with: { name: npm, path: "npm-dist/*.tgz" }
  pypi:
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # yea-sdk and yea-mcp, built without uv's local sources, as PyPI installs them.
      - run: |
          uv build --no-sources --out-dir python-dist python
          uv build --no-sources --out-dir python-dist python/mcp
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "python-dist/*" }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python-dist }
      - uses: actions/upload-artifact@v7
        with: { name: pypi, path: "python-dist/*" }
  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
  mcp-registry:
    needs: [npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc && ./mcp-publisher publish
