version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Minor and patch dev updates travel together; each major gets its own PR.
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest Node the SDK supports (ts/package.json engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # uv, not pip: only the uv ecosystem updates uv.lock, where the transitive pins live.
  - package-ecosystem: uv
    directories: [/python, /python/mcp]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
