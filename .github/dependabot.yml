version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      # Minor and patch dev updates travel together; each major gets its own PR.
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest Node the SDK supports (ts/package.json engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directories: [/python, /python/mcp]
    schedule: { interval: weekly }
    # Transitive pins (authlib, dnspython, joserfc) live only in uv.lock, so update those too,
    # and raise a pyproject range only when a new version falls outside it.
    allow: [{ dependency-type: all }]
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
