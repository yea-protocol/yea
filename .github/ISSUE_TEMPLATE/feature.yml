name: Feature
description: Propose something new for the framework, CLI, MCP bridge or connectors
type: Feature
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what do they do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd build. A code sketch of the API helps most.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: spec
    attributes:
      label: Does it need a spec change?
      options: ["No", "Yes", "Not sure"]
    validations: { required: true }
