name: Bug
description: Something in the TypeScript or Python implementation, CLI, or MCP bridge misbehaves
type: Bug
labels: [needs-triage]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [TypeScript library, Python library, CLI, MCP bridge, Examples, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened, and what did you expect?"
      description: "Include the Lens or JSON frames if relevant."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
