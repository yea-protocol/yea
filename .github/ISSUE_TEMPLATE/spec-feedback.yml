name: Spec feedback
description: An ambiguity, gap, or proposed change in SPEC.md
type: Feature
labels: [area/spec, needs-triage]
body:
  - type: input
    id: section
    attributes:
      label: Section
      placeholder: "e.g. §6.3 Caveats"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What is unclear or wrong?"
      description: Quote the text if you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
