[project]
name = "yea-sdk"
version = "0.1.0"
description = "YEA: the open protocol for AI agents acting on behalf of people (Python implementation)"
license = "Apache-2.0"
keywords = ["ai", "agents", "ai-agents", "llm", "protocol", "mcp", "delegation", "capabilities", "ed25519", "consent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
authors = [
    { name = "James Solomon", email = "solomonjames@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.1",
]

[project.urls]
Homepage = "https://yea-protocol.github.io/yea/"
Repository = "https://github.com/yea-protocol/yea"
Specification = "https://github.com/yea-protocol/yea/blob/main/SPEC.md"
Issues = "https://github.com/yea-protocol/yea/issues"

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yea"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
